<!DOCTYPE html>
<html>
<head>
    <title>Popup Demo</title>
</head>
<body>

    <button onclick="showPopup()">Show Popup</button>

    <script>
        function showPopup() {
            alert("⚠️ You are hacked!");
        }
    </script>

</body>
</html>

Or to show it automatically when the page loads:

<!DOCTYPE html>
<html>
<head>
    <title>Popup Demo</title>
</head>
<body>

    <script>
        window.onload = function() {
            alert("⚠️ You are hacked!");
        };
    </script>

</body>
</html>

This only displays a message and does not perform any real hacking or system actions.
