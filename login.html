

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPRCAS Login</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#f4f4f4;
    }

    .login-container{
        background:white;
        padding:30px;
        width:350px;
        border-radius:10px;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
        text-align:center;
    }

    .logo{
        width:100px;
        margin-bottom:15px;
    }

    h2{
        color:#1f4e79;
        margin-bottom:20px;
    }

    .input-box{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:1px solid #ccc;
        border-radius:5px;
    }

    .login-btn{
        width:100%;
        padding:12px;
        background:#1f4e79;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    .login-btn:hover{
        background:#163a5c;
    }

    .forgot{
        display:block;
        margin-top:10px;
        color:#1f4e79;
        text-decoration:none;
    }
</style>
</head>
<body>

<div class="login-container">
    <img src="kprcaslogo.jpeg" alt="KPRCAS Logo" class="logo">

    <h2>KPRCAS Login</h2>

    <form>
        <input type="text" class="input-box" placeholder="Username" required>

        <input type="password" class="input-box" placeholder="Password" required>

        <button type="submit" class="login-btn">Login</button>

        <a href="#" class="forgot">Forgot Password?</a>
    </form>
</div>

</body>
</html>
