<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPRCAS Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#003366,#0055aa);
}

.login-box{
    background:white;
    width:350px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

.logo{
    width:100px;
    margin-bottom:15px;
}

h2{
    color:#003366;
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    font-size:14px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#f4b400;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#d99c00;
}

.footer{
    margin-top:15px;
    font-size:12px;
    color:#777;
}
</style>
</head>

<body>

<div class="login-box">

    <!-- Replace logo.png with actual KPRCAS logo file -->
    <img src="logo.png" alt="KPRCAS Logo" class="logo">

    <h2>KPR College of Arts, Science and Research</h2>
    <p class="subtitle">Student Login Portal</p>

    <form onsubmit="login(event)">
        <input type="text" id="username" placeholder="Register Number" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <div class="footer">
        © 2026 KPRCAS
    </div>

</div>

<script>
function login(event){
    event.preventDefault();

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "student" && pass === "1234"){
        alert("Login Successful!");
    } else {
        alert("Invalid Register Number or Password");
    }
}
</script>

</body>
</html>
